name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'  # 推送标签时触发（如 v3.0.0）
  workflow_dispatch:  # 手动触发

permissions:
  contents: write  # softprops/action-gh-release 创建 Release 需要

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: campus_expense_electron/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r campus_expense_web/requirements.txt
        pip install pyinstaller

    # backend.spec 内的路径（../campus_expense_web/backend/main.py）是相对
    # campus_expense_electron 的，因此必须在该目录下执行，产物落在 dist/backend
    - name: Build backend executable
      run: |
        cd campus_expense_electron
        pyinstaller backend.spec --clean --noconfirm

    - name: Copy backend to Electron resources
      run: |
        Remove-Item -Recurse -Force campus_expense_electron\resources\backend -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force campus_expense_electron\dist\backend campus_expense_electron\resources\backend

    - name: Install Node.js dependencies
      run: |
        cd campus_expense_electron
        npm ci

    - name: Build Windows executable
      run: |
        cd campus_expense_electron
        npm run build:win

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: campus_expense_electron/dist/*Setup*.exe
        retention-days: 30

    - name: Upload Windows portable
      uses: actions/upload-artifact@v4
      with:
        name: windows-portable
        path: |
          campus_expense_electron/dist/*.exe
          !campus_expense_electron/dist/*Setup*.exe
        retention-days: 30
        if-no-files-found: error

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          campus_expense_electron/dist/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
