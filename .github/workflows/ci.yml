name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop, 'feature/*' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd campus_expense_web/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run tests with coverage
      run: |
        cd campus_expense_web/backend
        python -m pytest tests/ -v --cov=main --cov-report=xml
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        file: ./campus_expense_web/backend/coverage.xml
        flags: backend
        fail_ci_if_error: false

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        # vite 8 要求 node ^20.19.0 || >=22.12.0，与本地开发环境保持一致
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: campus_expense_web/frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd campus_expense_web/frontend
        npm ci
    
    - name: Run tests
      run: |
        cd campus_expense_web/frontend
        npm run test:run
    
    - name: Build frontend
      run: |
        cd campus_expense_web/frontend
        npm run build

  electron-test:
    name: Electron Renderer Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: campus_expense_electron/package-lock.json

    - name: Install dependencies
      run: |
        cd campus_expense_electron
        npm ci

    - name: Typecheck
      run: |
        cd campus_expense_electron
        npm run typecheck

    - name: Run renderer tests
      run: |
        cd campus_expense_electron
        npm run test:run

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: campus_expense_web/backend/requirements-dev.txt
    
    - name: Install Python linters
      run: |
        cd campus_expense_web/backend
        # 用 requirements-dev.txt 里固定的版本，避免装到最新版后格式规则变化导致误报
        pip install -r requirements-dev.txt
    
    - name: Check Python formatting with black
      run: |
        cd campus_expense_web/backend
        black --check main.py
    
    - name: Check Python imports with isort
      run: |
        cd campus_expense_web/backend
        isort --check-only main.py
    
    - name: Lint Python with flake8
      run: |
        cd campus_expense_web/backend
        flake8 main.py --max-line-length=100 --ignore=E501,W503
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    
    - name: Install frontend dependencies
      run: |
        cd campus_expense_web/frontend
        npm ci
    
    - name: Check frontend formatting with Prettier
      run: |
        cd campus_expense_web/frontend
        npx prettier --check "src/**/*.{vue,ts,js}"
    
    - name: Lint frontend with ESLint
      run: |
        cd campus_expense_web/frontend
        npm run lint || true
